permissions:
  contents: read
  packages: write

name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python setup
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Lint / sanity check
      # -----------------------------
      - name: Lint import sanity
        run: python -m compileall app

      # -----------------------------
      # Eval-to-CI regression gate. Runs BEFORE the docker build/push
      # steps below, deliberately -- the whole point of a gate is
      # blocking what comes after it, so it has to run first, not
      # alongside or after image publishing.
      #
      # REAL PREREQUISITE, not something this workflow file can satisfy
      # on its own: this connects to a PERSISTENT, already-populated
      # Qdrant + Redis deployment via secrets below, not fresh service
      # containers spun up for this job. run_ci_gate.py actually
      # constructs and runs the full LangGraphOrchestrator -- real
      # OpenAI calls, real Qdrant queries against the hybrid
      # dense+sparse collection built earlier this session, real Redis
      # caching. A freshly-spun-up Qdrant container would be completely
      # empty -- nothing to query -- and rebuilding the full data
      # pipeline (a few hundred thousand reviews, real embeddings) from
      # scratch on every single PR would make this gate impractically
      # slow and expensive. QDRANT_URL/REDIS_URL need to point at a
      # real, already-built deployment reachable from GitHub's runners,
      # not localhost service containers.
      - name: Run eval regression gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: python -m app.evaluation.run_ci_gate

      # -----------------------------
      # Docker buildx setup
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------
      # Login to GHCR (or Docker Hub)
      # -----------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Build API image
      # -----------------------------
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-api:v19
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------
      # Build Streamlit UI image
      # -----------------------------
      - name: Build Streamlit UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.streamlit
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-ui:v10
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max