# Minimal, working config -- receives OTLP/HTTP on 4318 and logs what it
# gets to the collector's own stdout via the debug exporter, so the
# service actually does something visible without needing a downstream
# backend (Jaeger, Tempo, etc.) configured yet. Point the exporters list
# at a real backend when you have one; this is a starting point, not a
# production destination.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

exporters:
  debug:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]