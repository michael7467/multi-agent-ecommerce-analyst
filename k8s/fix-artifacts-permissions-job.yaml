apiVersion: batch/v1
kind: Job
metadata:
  name: fix-artifacts-permissions
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              mkdir -p /app/artifacts/memory
              chmod -R 777 /app/artifacts
              ls -la /app/artifacts/memory
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: artifacts-storage
              mountPath: /app/artifacts
      volumes:
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: artifacts-pvc