permissions:
  contents: read
  packages: write

name: CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      QDRANT_URL: http://localhost:6333
      REDIS_URL: redis://localhost:6379/0

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python setup
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # -----------------------------
      # Lint / sanity check
      # -----------------------------
      - name: Lint import sanity
        run: python -m compileall app

      # -----------------------------
      # Fetch real data + embeddings from S3
      # -----------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Download data and embeddings from S3
        run: |
          mkdir -p data/processed artifacts/embeddings artifacts/topics
          aws s3 sync s3://janoai/data/processed/ data/processed/
          aws s3 sync s3://janoai/artifacts/embeddings/ artifacts/embeddings/
          aws s3 sync s3://janoai/artifacts/topic_modeling/ artifacts/topics/

      - name: Build Qdrant index
        run: python -m app.rag.qdrant_index_builder

      # -----------------------------
      # Eval gate
      # -----------------------------
      - name: Run eval regression gate
        run: python -m app.evaluation.runners.run_ci_gate

      # -----------------------------
      # Docker buildx setup
      # -----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------
      # Login to GHCR (or Docker Hub)
      # -----------------------------
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------
      # Build API image
      # -----------------------------
      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-api:v19
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------
      # Build Streamlit UI image
      # -----------------------------
      - name: Build Streamlit UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.streamlit
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-ui:v10
            ghcr.io/${{ github.repository_owner }}/ecommerce-analyst-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max